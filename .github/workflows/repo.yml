name: Build tweaks and APT index

# tweaks/<name>/ changed: GitHub's macOS runner (free for public repos) builds the .debs into
# debs/. Then the APT index (Packages, Release) is rebuilt. The repo is served straight from
# raw.githubusercontent.com (GitHub Pages deploys failed for this account).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo
  cancel-in-progress: false

jobs:
  tweaks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Which tweaks changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git diff --quiet HEAD~1 HEAD -- tweaks; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.changed.outputs.build == 'yes'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          grep -vE '^\s*(#|$)' tweaks/tweaks.txt | while read -r folder frameworks; do
            echo "== $folder"
            ./tweaks/build-tweak.sh "tweaks/$folder" $frameworks
          done
          ls -la debs
      - name: Commit the debs
        if: steps.changed.outputs.build == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A debs
          git diff --cached --quiet || { git commit -m "Build tweaks [skip ci]" && git pull --rebase && git push; }

  index:
    needs: tweaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tools
        run: sudo apt-get install -y dpkg-dev apt-utils zstd >/dev/null
      - name: Build the index
        run: ./build-repo.sh
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Packages Packages.* Release
          git diff --cached --quiet || { git commit -m "Rebuild APT index [skip ci]" && git push; }
