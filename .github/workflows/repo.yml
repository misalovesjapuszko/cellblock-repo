name: Rebuild APT index

# Adding or removing a .deb in debs/ rebuilds Packages and Release. The repo is served
# straight from raw.githubusercontent.com (GitHub Pages deploys failed for this account).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y dpkg-dev apt-utils zstd >/dev/null
      - name: Build the index
        run: ./build-repo.sh
      - name: Keep the index in the repo too
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Packages Packages.* Release
          git diff --cached --quiet || { git commit -m "Rebuild APT index [skip ci]" && git push; }
