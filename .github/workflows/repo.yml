name: Rebuild APT index and publish

# Adding or removing a .deb in debs/ rebuilds Packages and Release and publishes the repo
# on GitHub Pages (https://misalovesjapuszko.github.io/cellblock-repo/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y dpkg-dev apt-utils zstd >/dev/null
      - name: Build the index
        run: ./build-repo.sh
      - name: Keep the index in the repo too
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Packages Packages.* Release
          git diff --cached --quiet || { git commit -m "Rebuild APT index [skip ci]" && git push; }
      - name: Site
        run: |
          mkdir _site
          cp -R debs Packages Packages.* Release index.html CydiaIcon.png icon.png .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
